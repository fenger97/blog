<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">文章详情 - Fenger Journal</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <header class="header">
            <div class="header-content">
                <!-- 头像 -->
                <div class="site-avatar">
                    <img src="/static/images/avatar-favicon.jpg" alt="Fenger" />
                </div>
                <h1 class="site-title">
                    <a href="/" class="home-link">Fenger Journal</a>
                </h1>
                <!-- <p class="site-description">分享我的想法和思考</p> -->
            </div>
        </header>

        <!-- 文章详情 -->
        <main class="main-content">
            <article id="postDetail" class="post-detail">
                <!-- 文章内容将通过 JavaScript 动态加载 -->
            </article>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>&copy; 2024 Fenger Journal · 用 Go 和 MongoDB 构建</p>
        </footer>
    </div>
    <script src="/static/js/post.js"></script>
</body>
</html>
