<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fenger Journal</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 网页标签图标 -->
    <link rel="icon" href="/static/images/avatar-favicon.jpg" type="image/jpg">
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <header class="header">
            <div class="header-content">
                <!-- 头像 -->
                <div class="site-avatar">
                    <img src="/static/images/avatar-favicon.jpg" alt="Fenger" />
                </div>
                <h1 class="site-title"><a href="/" class="home-link">Fenger Journal</a></h1>
                <!-- <p class="site-description">分享我的想法和思考</p> -->
                <div class="admin-controls">
                    <button id="newPostBtn" class="btn btn-primary hidden">写新文章</button>
                    <button id="logoutBtn" class="btn btn-secondary hidden">退出登录</button>
                </div>
            </div>
        </header>

        <!-- 写文章表单 -->
        <div id="postForm" class="post-form hidden">
            <div class="form-container">
                <h2>写新文章</h2>
                <form id="createPostForm">
                    <div class="form-group">
                        <label for="title">标题</label>
                        <input type="text" id="title" name="title" required placeholder="文章标题">
                    </div>
                    <div class="form-group">
                        <label for="content">内容 (支持 Markdown)</label>
                        <div class="markdown-editor">
                            <div class="editor-tabs">
                                <button type="button" class="tab-btn active" data-tab="edit">编辑</button>
                                <button type="button" class="tab-btn" data-tab="preview">预览</button>
                            </div>
                            <div class="editor-toolbar">
                                <button type="button" class="toolbar-btn" id="uploadImageBtn">
                                    📷 插入图片
                                </button>
                                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                            </div>
                            <div class="editor-content">
                                <textarea id="content" name="content" rows="12" required placeholder="在这里输入 Markdown 内容..."></textarea>
                                <div id="preview" class="markdown-preview hidden"></div>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">发布</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 文章列表 -->
        <main class="main-content">
            <div id="posts" class="posts">
                <!-- 文章列表将通过 JavaScript 动态加载 -->
            </div>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>&copy; 2024 Fenger Journal · 用 Go 和 MongoDB 构建</p>
        </footer>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
